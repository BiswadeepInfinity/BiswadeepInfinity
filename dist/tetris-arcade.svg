<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280">
  <defs>
    <linearGradient id="arcadeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14"/>
      <stop offset="50%" stop-color="#0d1326"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes fallPiece1 {
      0% { transform: translateY(-40px); opacity: 0; }
      15% { opacity: 1; }
      75% { transform: translateY(140px); }
      85% { transform: translateY(140px); opacity: 1; }
      92% { opacity: 0.2; }
      100% { transform: translateY(140px); opacity: 0; }
    }
    @keyframes fallPiece2 {
      0% { transform: translateY(-60px) rotate(0deg); opacity: 0; }
      20% { opacity: 1; }
      70% { transform: translateY(120px) rotate(90deg); }
      85% { transform: translateY(120px) rotate(90deg); opacity: 1; }
      95% { opacity: 0.1; }
      100% { transform: translateY(120px) rotate(90deg); opacity: 0; }
    }
    @keyframes lineFlash {
      0%, 75% { opacity: 0; }
      80%, 90% { opacity: 1; filter: drop-shadow(0 0 8px #00ffff); }
      95%, 100% { opacity: 0; }
    }
    @keyframes pulseScore {
      0%, 100% { fill: #38bdf8; }
      50% { fill: #f43f5e; }
    }
    .pixel-text { font-family: 'Courier New', 'Fira Code', monospace; }
    .anim-p1 { animation: fallPiece1 4s infinite cubic-bezier(0.4, 0, 0.2, 1); }
    .anim-p2 { animation: fallPiece2 4s infinite cubic-bezier(0.4, 0, 0.2, 1) 1.5s; }
    .line-clear { animation: lineFlash 4s infinite; }
    .score-pulse { animation: pulseScore 2s infinite ease-in-out; }
  </style>

  <!-- Arcade Outer Frame -->
  <rect x="4" y="4" width="872" height="272" rx="16" fill="url(#arcadeBg)" stroke="url(#cyanGlow)" stroke-width="2.5" filter="drop-shadow(0 0 10px rgba(0, 240, 255, 0.3))"/>

  <!-- Top Marquee Bar -->
  <rect x="16" y="16" width="848" height="36" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <circle cx="36" cy="34" r="6" fill="#ef4444" filter="drop-shadow(0 0 4px #ef4444)"/>
  <circle cx="54" cy="34" r="6" fill="#eab308" filter="drop-shadow(0 0 4px #eab308)"/>
  <circle cx="72" cy="34" r="6" fill="#22c55e" filter="drop-shadow(0 0 4px #22c55e)"/>
  <text x="95" y="39" fill="#38bdf8" font-size="13" font-weight="bold" class="pixel-text" letter-spacing="1.5">🕹️ SYSTEMS &amp; NEUROTECH ARCADE // C. ELEGANS TO RT-GNN</text>
  <text x="730" y="39" fill="#a855f7" font-size="12" font-weight="bold" class="pixel-text">LVL: 99</text>

  <!-- Left Stats / Player HUD Column -->
  <g transform="translate(24, 68)">
    <text x="0" y="20" fill="#94a3b8" font-size="12" class="pixel-text">PLAYER:</text>
    <text x="75" y="20" fill="#f8fafc" font-weight="bold" font-size="14" class="pixel-text">BiswadeepInfinity</text>

    <text x="0" y="45" fill="#94a3b8" font-size="12" class="pixel-text">DOMAIN:</text>
    <text x="75" y="45" fill="#38bdf8" font-weight="bold" font-size="13" class="pixel-text">Systems Architecture &amp; Neurotech</text>

    <text x="0" y="72" fill="#94a3b8" font-size="12" class="pixel-text">ACTIVE RESEARCH RELICS:</text>
    <rect x="0" y="82" width="190" height="24" rx="4" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
    <text x="8" y="98" fill="#38bdf8" font-size="10.5" font-weight="bold" class="pixel-text">⚡ CVRS (Sortingless C)</text>
    
    <rect x="198" y="82" width="195" height="24" rx="4" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
    <text x="206" y="98" fill="#c084fc" font-size="10.5" font-weight="bold" class="pixel-text">🧠 RT-GNN (C. elegans)</text>

    <text x="0" y="132" fill="#94a3b8" font-size="11" class="pixel-text">CORE METRICS:</text>
    <!-- XP Bar 1 -->
    <text x="0" y="150" fill="#cbd5e1" font-size="11" class="pixel-text">C / Low-Level Memory:</text>
    <rect x="180" y="141" width="180" height="10" rx="3" fill="#1e293b"/>
    <rect x="180" y="141" width="170" height="10" rx="3" fill="#22c55e" filter="drop-shadow(0 0 3px #22c55e)"/>
    <text x="368" y="150" fill="#22c55e" font-size="10" class="pixel-text">95%</text>

    <!-- XP Bar 2 -->
    <text x="0" y="170" fill="#cbd5e1" font-size="11" class="pixel-text">Neurotech &amp; Synapse GNN:</text>
    <rect x="180" y="161" width="180" height="10" rx="3" fill="#1e293b"/>
    <rect x="180" y="161" width="178" height="10" rx="3" fill="#38bdf8" filter="drop-shadow(0 0 3px #38bdf8)"/>
    <text x="368" y="170" fill="#38bdf8" font-size="10" class="pixel-text">99%</text>

    <!-- XP Bar 3 -->
    <text x="0" y="190" fill="#cbd5e1" font-size="11" class="pixel-text">Unreal Engine Simulation:</text>
    <rect x="180" y="181" width="180" height="10" rx="3" fill="#1e293b"/>
    <rect x="180" y="181" width="165" height="10" rx="3" fill="#f59e0b" filter="drop-shadow(0 0 3px #f59e0b)"/>
    <text x="368" y="190" fill="#f59e0b" font-size="10" class="pixel-text">92%</text>
  </g>

  <!-- Center Divider Neon Line -->
  <line x1="435" y1="65" x2="435" y2="260" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Right Side: Mini Tetris Playing Field -->
  <g transform="translate(450, 65)">
    <!-- Score & Stats Box -->
    <rect x="0" y="0" width="180" height="195" rx="8" fill="#111827" stroke="#1f2937"/>
    <text x="16" y="24" fill="#94a3b8" font-size="11" class="pixel-text">SCORE</text>
    <text x="16" y="46" font-size="16" font-weight="bold" class="pixel-text score-pulse">2,048,160</text>

    <text x="16" y="72" fill="#94a3b8" font-size="11" class="pixel-text">THROUGHPUT</text>
    <text x="16" y="92" fill="#22c55e" font-size="13" font-weight="bold" class="pixel-text">19,379 ops/s</text>

    <text x="16" y="118" fill="#94a3b8" font-size="11" class="pixel-text">TEST GATES</text>
    <text x="16" y="138" fill="#38bdf8" font-size="13" font-weight="bold" class="pixel-text">35 / 35 PASS</text>

    <text x="16" y="164" fill="#94a3b8" font-size="11" class="pixel-text">NEXT RELIC</text>
    <g transform="translate(16, 172)">
      <rect x="0" y="0" width="12" height="12" fill="#ec4899" stroke="#000" stroke-width="1" rx="2"/>
      <rect x="14" y="0" width="12" height="12" fill="#ec4899" stroke="#000" stroke-width="1" rx="2"/>
      <rect x="28" y="0" width="12" height="12" fill="#ec4899" stroke="#000" stroke-width="1" rx="2"/>
      <rect x="14" y="-14" width="12" height="12" fill="#ec4899" stroke="#000" stroke-width="1" rx="2"/>
    </g>
  </g>

  <!-- Tetris Well (Matrix) -->
  <g transform="translate(650, 65)">
    <rect x="0" y="0" width="200" height="195" rx="8" fill="#070a12" stroke="#38bdf8" stroke-width="1.5"/>
    
    <!-- Background Grid Lines -->
    <path d="M20,0 V195 M40,0 V195 M60,0 V195 M80,0 V195 M100,0 V195 M120,0 V195 M140,0 V195 M160,0 V195 M180,0 V195" stroke="#131d33" stroke-width="1"/>
    <path d="M0,20 H200 M0,40 H200 M0,60 H200 M0,80 H200 M0,100 H200 M0,120 H200 M0,140 H200 M0,160 H200 M0,180 H200" stroke="#131d33" stroke-width="1"/>

    <!-- Static Stack Blocks at Bottom -->
    <g>
      <!-- Bottom row 175 -->
      <rect x="0" y="175" width="20" height="20" fill="#0284c7" stroke="#070a12" rx="2"/>
      <rect x="20" y="175" width="20" height="20" fill="#0284c7" stroke="#070a12" rx="2"/>
      <rect x="40" y="175" width="20" height="20" fill="#eab308" stroke="#070a12" rx="2"/>
      <rect x="60" y="175" width="20" height="20" fill="#eab308" stroke="#070a12" rx="2"/>
      <rect x="80" y="175" width="20" height="20" fill="#22c55e" stroke="#070a12" rx="2"/>
      <rect x="100" y="175" width="20" height="20" fill="#22c55e" stroke="#070a12" rx="2"/>
      <rect x="140" y="175" width="20" height="20" fill="#ef4444" stroke="#070a12" rx="2"/>
      <rect x="160" y="175" width="20" height="20" fill="#ef4444" stroke="#070a12" rx="2"/>
      <rect x="180" y="175" width="20" height="20" fill="#06b6d4" stroke="#070a12" rx="2"/>

      <!-- Second row 155 -->
      <rect x="40" y="155" width="20" height="20" fill="#eab308" stroke="#070a12" rx="2"/>
      <rect x="60" y="155" width="20" height="20" fill="#eab308" stroke="#070a12" rx="2"/>
      <rect x="80" y="155" width="20" height="20" fill="#a855f7" stroke="#070a12" rx="2"/>
      <rect x="140" y="155" width="20" height="20" fill="#ec4899" stroke="#070a12" rx="2"/>
      <rect x="160" y="155" width="20" height="20" fill="#ec4899" stroke="#070a12" rx="2"/>
    </g>

    <!-- Falling Piece 1: Cyan 'I' bar -->
    <g class="anim-p1">
      <rect x="120" y="0" width="20" height="20" fill="#00f0ff" stroke="#070a12" rx="2" filter="drop-shadow(0 0 4px #00f0ff)"/>
      <rect x="120" y="20" width="20" height="20" fill="#00f0ff" stroke="#070a12" rx="2" filter="drop-shadow(0 0 4px #00f0ff)"/>
      <rect x="120" y="40" width="20" height="20" fill="#00f0ff" stroke="#070a12" rx="2" filter="drop-shadow(0 0 4px #00f0ff)"/>
      <rect x="120" y="60" width="20" height="20" fill="#00f0ff" stroke="#070a12" rx="2" filter="drop-shadow(0 0 4px #00f0ff)"/>
    </g>

    <!-- Falling Piece 2: Magenta 'T' piece -->
    <g class="anim-p2">
      <rect x="0" y="0" width="20" height="20" fill="#f43f5e" stroke="#070a12" rx="2" filter="drop-shadow(0 0 4px #f43f5e)"/>
      <rect x="20" y="0" width="20" height="20" fill="#f43f5e" stroke="#070a12" rx="2" filter="drop-shadow(0 0 4px #f43f5e)"/>
      <rect x="40" y="0" width="20" height="20" fill="#f43f5e" stroke="#070a12" rx="2" filter="drop-shadow(0 0 4px #f43f5e)"/>
      <rect x="20" y="20" width="20" height="20" fill="#f43f5e" stroke="#070a12" rx="2" filter="drop-shadow(0 0 4px #f43f5e)"/>
    </g>

    <!-- Line Clear Flash Overlay -->
    <rect x="0" y="175" width="200" height="20" fill="#ffffff" class="line-clear" rx="2"/>
  </g>
</svg>