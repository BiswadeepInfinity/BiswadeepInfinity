<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 215" width="880" height="215">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="50%" stop-color="#0c111d"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="neuralGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes fallTetro1 {
      0% { transform: translateY(-36px); opacity: 0; }
      15% { opacity: 1; }
      75% { transform: translateY(108px); opacity: 1; }
      85% { transform: translateY(108px); opacity: 1; }
      92% { opacity: 0.3; }
      100% { transform: translateY(108px); opacity: 0; }
    }
    @keyframes fallTetro2 {
      0% { transform: translateY(-54px); opacity: 0; }
      20% { opacity: 1; }
      70% { transform: translateY(90px); opacity: 1; }
      85% { transform: translateY(90px); opacity: 1; }
      95% { opacity: 0.2; }
      100% { transform: translateY(90px); opacity: 0; }
    }
    @keyframes synapsePulse {
      0%, 70% { opacity: 0.2; stroke: #334155; }
      75%, 85% { opacity: 1; stroke: #38bdf8; filter: drop-shadow(0 0 6px #38bdf8); }
      95%, 100% { opacity: 0.2; stroke: #334155; }
    }
    .fira-text { font-family: 'Fira Code', 'Courier New', monospace; }
    .inter-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .anim-tetro1 { animation: fallTetro1 4.5s infinite cubic-bezier(0.4, 0, 0.2, 1); }
    .anim-tetro2 { animation: fallTetro2 4.5s infinite cubic-bezier(0.4, 0, 0.2, 1) 1.8s; }
    .synapse-fire { animation: synapsePulse 4.5s infinite; }
  </style>

  <!-- Clean Minimalist Frame -->
  <rect x="2" y="2" width="876" height="211" rx="10" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Accent Line -->
  <line x1="2" y1="2" x2="878" y2="2" stroke="url(#neuralGlow)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left Column: Systems & Neurocognition Architecture -->
  <g transform="translate(26, 22)">
    <!-- Core Inquiry -->
    <text x="0" y="14" fill="#64748b" font-size="9" font-weight="600" class="fira-text" letter-spacing="1">RESEARCH DOMAIN &amp; INQUIRY</text>
    <text x="0" y="32" fill="#f1f5f9" font-size="12" font-weight="600" class="inter-text">Systems Engineering &amp; Computational Neurocognition</text>
    <text x="0" y="47" fill="#94a3b8" font-size="11" class="inter-text" font-style="italic">"Understanding how biological cognitive networks understand"</text>

    <!-- Language Stack -->
    <text x="0" y="74" fill="#64748b" font-size="9" font-weight="600" class="fira-text" letter-spacing="1">PRIMARY SYSTEMS STACK</text>
    <g transform="translate(0, 84)">
      <rect x="0" y="0" width="165" height="24" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
      <circle cx="12" cy="12" r="3" fill="#38bdf8"/>
      <text x="22" y="16" fill="#e2e8f0" font-size="11" font-weight="600" class="fira-text">Python (Major)</text>

      <rect x="175" y="0" width="160" height="24" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
      <circle cx="187" cy="12" r="3" fill="#94a3b8"/>
      <text x="197" y="16" fill="#e2e8f0" font-size="11" font-weight="600" class="fira-text">C (Next Major)</text>

      <rect x="345" y="0" width="115" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="357" cy="12" r="3" fill="#a855f7"/>
      <text x="367" y="16" fill="#cbd5e1" font-size="11" class="fira-text">Unreal / C++</text>
    </g>

    <!-- Co-Flagships Row -->
    <text x="0" y="130" fill="#64748b" font-size="9" font-weight="600" class="fira-text" letter-spacing="1">CO-FLAGSHIP ARCHITECTURES</text>
    <g transform="translate(0, 140)">
      <!-- RT-GNN -->
      <rect x="0" y="0" width="225" height="34" rx="4" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
      <text x="10" y="16" fill="#c084fc" font-size="11" font-weight="bold" class="fira-text">🧠 RT-GNN (Semigroup)</text>
      <text x="10" y="28" fill="#94a3b8" font-size="9" class="fira-text">Continuous Synaptic Rotation</text>

      <!-- CVRS -->
      <rect x="235" y="0" width="225" height="34" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
      <text x="245" y="16" fill="#38bdf8" font-size="11" font-weight="bold" class="fira-text">⚡ CVRS (Sortingless)</text>
      <text x="245" y="28" fill="#94a3b8" font-size="9" class="fira-text">Memory-Bounded Pathfinding</text>
    </g>
  </g>

  <!-- Vertical Divider with Synapse Nodes -->
  <g transform="translate(510, 16)">
    <line x1="0" y1="6" x2="0" y2="182" stroke="#1e293b" stroke-width="1"/>
    <circle cx="0" cy="38" r="3" fill="#38bdf8"/>
    <circle cx="0" cy="94" r="3" fill="#a855f7"/>
    <circle cx="0" cy="150" r="3" fill="#0284c7"/>
  </g>

  <!-- Right Column: The Minimal Synapse-Tetris Lattice (Connectome Grid) -->
  <g transform="translate(540, 20)">
    <!-- Header for Grid -->
    <text x="0" y="12" fill="#64748b" font-size="9" font-weight="600" class="fira-text" letter-spacing="1">SYNAPTIC LATTICE MATRIX</text>
    <text x="210" y="12" fill="#38bdf8" font-size="9" font-weight="600" class="fira-text">T_Δt(z)</text>

    <!-- Lattice Grid -->
    <g transform="translate(0, 20)">
      <!-- Matrix Outline -->
      <rect x="0" y="0" width="290" height="154" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>

      <!-- Clean Grid Lines -->
      <path d="M29,0 V154 M58,0 V154 M87,0 V154 M116,0 V154 M145,0 V154 M174,0 V154 M203,0 V154 M232,0 V154 M261,0 V154" stroke="#0f172a" stroke-width="1"/>
      <path d="M0,22 H290 M0,44 H290 M0,66 H290 M0,88 H290 M0,110 H290 M0,132 H290" stroke="#0f172a" stroke-width="1"/>

      <!-- Synaptic Connection Edges (Axons across blocks) -->
      <path d="M87,132 L145,110 L203,132 L261,110" stroke="#334155" stroke-width="1.5" fill="none" class="synapse-fire"/>
      <path d="M29,110 L87,132 L116,88 L145,110" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" fill="none"/>

      <!-- Static Synaptic Tetromino Blocks in Matrix (Locked Synapses) -->
      <g>
        <!-- Bottom Row (Locked Blocks) -->
        <rect x="29" y="132" width="28" height="21" rx="2" fill="#0284c7" stroke="#030712"/>
        <rect x="58" y="132" width="28" height="21" rx="2" fill="#0284c7" stroke="#030712"/>
        <rect x="87" y="132" width="28" height="21" rx="2" fill="#6366f1" stroke="#030712"/>
        <rect x="116" y="132" width="28" height="21" rx="2" fill="#6366f1" stroke="#030712"/>
        <rect x="174" y="132" width="28" height="21" rx="2" fill="#0ea5e9" stroke="#030712"/>
        <rect x="203" y="132" width="28" height="21" rx="2" fill="#0ea5e9" stroke="#030712"/>
        <rect x="232" y="132" width="28" height="21" rx="2" fill="#8b5cf6" stroke="#030712"/>
        <rect x="261" y="132" width="28" height="21" rx="2" fill="#8b5cf6" stroke="#030712"/>

        <!-- Second Row -->
        <rect x="87" y="110" width="28" height="21" rx="2" fill="#6366f1" stroke="#030712"/>
        <rect x="116" y="110" width="28" height="21" rx="2" fill="#6366f1" stroke="#030712"/>
        <rect x="174" y="110" width="28" height="21" rx="2" fill="#0ea5e9" stroke="#030712"/>
        <rect x="232" y="110" width="28" height="21" rx="2" fill="#8b5cf6" stroke="#030712"/>
      </g>

      <!-- Synaptic Nodes on Blocks -->
      <circle cx="43" cy="142" r="2.5" fill="#38bdf8"/>
      <circle cx="101" cy="120" r="2.5" fill="#a855f7"/>
      <circle cx="188" cy="120" r="2.5" fill="#38bdf8"/>
      <circle cx="246" cy="120" r="2.5" fill="#c084fc"/>

      <!-- Falling Synaptic Tetromino 1: Cyan 'I' piece -->
      <g class="anim-tetro1">
        <rect x="145" y="0" width="28" height="21" rx="2" fill="#00f0ff" stroke="#030712" filter="drop-shadow(0 0 3px #00f0ff)"/>
        <rect x="145" y="22" width="28" height="21" rx="2" fill="#00f0ff" stroke="#030712" filter="drop-shadow(0 0 3px #00f0ff)"/>
        <rect x="145" y="44" width="28" height="21" rx="2" fill="#00f0ff" stroke="#030712" filter="drop-shadow(0 0 3px #00f0ff)"/>
        <circle cx="159" cy="32" r="2" fill="#ffffff"/>
      </g>

      <!-- Falling Synaptic Tetromino 2: Violet 'T' piece -->
      <g class="anim-tetro2">
        <rect x="0" y="0" width="28" height="21" rx="2" fill="#a855f7" stroke="#030712" filter="drop-shadow(0 0 3px #a855f7)"/>
        <rect x="29" y="0" width="28" height="21" rx="2" fill="#a855f7" stroke="#030712" filter="drop-shadow(0 0 3px #a855f7)"/>
        <rect x="58" y="0" width="28" height="21" rx="2" fill="#a855f7" stroke="#030712" filter="drop-shadow(0 0 3px #a855f7)"/>
        <rect x="29" y="22" width="28" height="21" rx="2" fill="#a855f7" stroke="#030712" filter="drop-shadow(0 0 3px #a855f7)"/>
        <circle cx="43" cy="11" r="2" fill="#ffffff"/>
      </g>
    </g>
  </g>
</svg>